[theme]
base = "light"
primaryColor = "#a23a22"
backgroundColor = "#f3eee5"
secondaryBackgroundColor = "#e8e1d2"
textColor = "#0e0d0a"
linkColor = "#a23a22"
borderColor = "#d8d0bf"
baseRadius = "0px"
codeBackgroundColor = "#e8e1d2"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

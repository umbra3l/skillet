[theme]
# Star Atlas: deep navy chart ground, chalk ink. Amber is reserved for the
# five recommended skills (set in style.css), so controls use the sky blue.
base = "dark"
primaryColor = "#7fb3d5"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#17223a"
textColor = "#e9edf5"
linkColor = "#7fb3d5"
borderColor = "#25324d"
showWidgetBorder = true
baseRadius = "6px"
codeBackgroundColor = "#111a2d"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

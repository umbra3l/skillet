[theme]
base = "light"
primaryColor = "#b8743a"
backgroundColor = "#f7f0e1"
secondaryBackgroundColor = "#ede2c8"
textColor = "#1c1815"
linkColor = "#b8743a"
borderColor = "#e3d5b6"
baseRadius = "0px"
codeBackgroundColor = "#ede2c8"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

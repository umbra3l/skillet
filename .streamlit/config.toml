[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
linkColor = "#4f46e5"
borderColor = "#e2e8f0"
baseRadius = "10px"
codeBackgroundColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
